[project]
name = "rag-production"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DjeghlafLydia", email = "djeghlaf.habiba@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "bs4>=0.0.2",
    "langchain>=1.3.15",
    "langchain-anthropic>=1.5.6",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.5",
    "langchain-google-genai>=4.3.4",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.5.1",
    "langgraph>=1.2.11",
    "pypdf>=6.16.1",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
]

[project.scripts]
rag-production = "rag_production:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
